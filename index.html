
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스위스 여행 루트 추천기 최종본</title>
<style>
  :root{
    --bg:#f6f8fc; --card:#fff; --line:#e5e7eb; --text:#111827; --muted:#6b7280;
    --accent:#111827; --soft:#eef2ff; --warn:#fff1f2;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#f8fbff 0%,#f5f7fb 100%);color:var(--text);line-height:1.65}
  .wrap{max-width:1280px;margin:0 auto;padding:24px}
  .hero,.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px rgba(15,23,42,.04)}
  .hero{padding:28px;margin-bottom:20px;background:linear-gradient(135deg,#fff 0%,#eef2ff 100%)}
  .card{padding:20px}
  .eyebrow{display:inline-flex;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;color:#334155;margin-bottom:12px}
  h1{font-size:34px;line-height:1.2;margin:0 0 10px}
  h2{font-size:22px;margin:0 0 14px}
  h3{font-size:18px;margin:0 0 10px}
  p{margin:0 0 12px}
  .muted{color:var(--muted)}
  .mode-select{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .mode-box{display:inline-flex;padding:14px 18px;border:2px solid #ddd;border-radius:12px;background:#fff;cursor:pointer;font-weight:700}
  .mode-box.active{border-color:#2b6cff;background:#eef3ff}
  .grid{display:grid;grid-template-columns:430px 1fr;gap:20px;align-items:start}
  .section{margin-bottom:18px}
  .label{font-size:14px;font-weight:700;margin-bottom:8px;display:block}
  select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;background:#fff;color:var(--text)}
  .btn{border:none;border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer;background:#111827;color:#fff}
  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .choice{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px 14px;cursor:pointer}
  .choice.active{background:#111827;color:#fff;border-color:#111827}
  .choice small{display:block;color:var(--muted);margin-top:4px}
  .choice.active small{color:#dbe3f1}
  .region-box{border:1px solid var(--line);border-radius:18px;background:#fafbfc;padding:14px;margin-bottom:12px}
  .region-head{display:flex;align-items:flex-start;gap:10px}
  .sub-grid{display:grid;gap:10px;margin-top:10px;padding-left:28px}
  .sub-theme{margin-top:8px;padding-left:18px;border-left:2px solid #e2e8f0}
  .check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 12px}
  .check input{margin-top:2px}
  .check small{display:block;color:var(--muted);margin-top:4px}
  .result .summary{background:#111827;color:#fff;padding:14px 16px;border-radius:12px;margin-bottom:14px}
  .notice{background:var(--warn);padding:12px;border-left:5px solid #dc2626;border-radius:10px;margin-bottom:14px}
  .route-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:700}
  .arrow{color:#6b7280;font-weight:700}
  .map-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;overflow:auto}
  .map-wrap svg{display:block;width:100%;min-width:760px;height:320px}
  .caption{font-size:13px;color:var(--muted);margin-top:8px}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
  .item,.day,.link-group{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .list,.day-list,.blog-links{display:grid;gap:10px}
  .badge{padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px}
  .topline{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .linkchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .link-chip{display:inline-flex;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:#111827;background:#fff}
  .link-chip:hover{background:#f9fafb}
  #manualSection,#recommendSection{display:none}
  .card-title-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  @media (max-width: 1024px){
    .grid,.two-col,.choice-grid{grid-template-columns:1fr}
    .wrap{padding:16px}
    h1{font-size:28px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="eyebrow">최종본 · 추천 일정 + 직접 선택 통합</div>
    <h1>스위스 여행 루트 추천기</h1>

        </div>

          <label class="label">출국 도시</label>
          <select id="recOutCity"><option>취리히</option><option selected>제네바</option></select>
        </div>
        <div class="section">
          <label class="label">여행 기간</label>
          <select id="recDays"><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option selected>10</option></select>
        </div>
        <div class="section">
          <label class="label">여행 스타일</label>
          <div class="choice-grid" id="recStyleGrid"></div>
        </div>
        <button class="btn" onclick="buildRecommend()">추천 루트 만들기</button>
      </div>

  <div id="manualSection">
    <div class="grid">

        <h2>직접 여행 루트 설계</h2>
        <div class="section">
          <label class="label">입국 도시</label>
          <select id="manInCity"><option>취리히</option><option>제네바</option></select>

          <label class="label">출국 도시</label>
          <select id="manOutCity"><option>취리히</option><option>제네바</option></select>
        </div>
        <div class="section">
          <label class="label">여행 기간</label>
          <select id="manDays"><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option selected>10</option></select>
        </div>
        <div class="section">
          <label class="label">여행 스타일</label>
          <div class="choice-grid" id="manStyleGrid"></div>
        </div>
        <div class="section">
          <label class="label">핵심 여행 지역 & 명소 선택</label>
          <div class="region-box" id="region-lucerne"></div>

    </div>
  </div>
</div>

function setMode(mode){
  document.getElementById("modeRecommendBtn").classList.remove("active");
  document.getElementById("modeManualBtn").classList.remove("active");
  document.getElementById("recommendSection").style.display = "none";
  document.getElementById("manualSection").style.display = "none";
  if(mode==="recommend"){
    document.getElementById("modeRecommendBtn").classList.add("active");
    document.getElementById("recommendSection").style.display = "block";
  } else {
    document.getElementById("modeManualBtn").classList.add("active");
    document.getElementById("manualSection").style.display = "block";
  }
}

function renderStyleGrid(containerId, current, setter){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = "";
  styleOptions.forEach(opt=>{
    const div = document.createElement("div");
    div.className = "choice" + (current===opt.key ? " active" : "");
    div.innerHTML = `<strong>${opt.label}</strong><small>${opt.desc}</small>`;
    div.onclick = ()=>setter(opt.key);
    wrap.appendChild(div);
  });
}

function routeLine(labels){
  let html = '<div class="route-line">';
  labels.forEach((v,i)=>{
    html += `<span class="pill">${v}</span>`;
    if(i<labels.length-1) html += '<span class="arrow">→</span>';
  });
  html += '</div>';
  return html;
}

function buildMapSection(labels, extra=[]){
  return buildMap(labels, extra);
}

function buildMap(labels, extra=[]){
  const routePoints = labels.map(l => mapNodes[l]).filter(Boolean);
  let svg = `<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="스위스 루트 지도"><rect x="0" y="0" width="780" height="320" fill="#ffffff"/>`;
  svg += `<defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#94a3b8" flood-opacity="0.22"/></filter>
    <linearGradient id="mapFill" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="routeStroke" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#64748b"/><stop offset="100%" stop-color="#111827"/></linearGradient>
  </defs>`;
  svg += `<path d="M48 168 C65 120,103 92,148 94 C185 56,246 44,308 60 C354 36,432 42,502 68 C560 48,625 56,664 98 C688 126,692 168,658 193 C648 225,612 239,570 242 C540 266,487 267,446 252 C406 277,350 276,305 251 C259 270,205 266,168 236 C128 247,84 225,58 195 C48 188,42 178,48 168 Z" fill="#eef4ff" stroke="#475569" stroke-width="4.5" filter="url(#shadow)"/>`;
  svg += `<path d="M48 168 C65 120,103 92,148 94 C185 56,246 44,308 60 C354 36,432 42,502 68 C560 48,625 56,664 98 C688 126,692 168,658 193 C648 225,612 239,570 242 C540 266,487 267,446 252 C406 277,350 276,305 251 C259 270,205 266,168 236 C128 247,84 225,58 195 C48 188,42 178,48 168 Z" fill="none" stroke="#64748b" stroke-width="2.2" opacity="0.9"/><ellipse cx="122" cy="178" rx="78" ry="45" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.4"/><text x="122" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">레만호</text><text x="235" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">SWITZERLAND</text><text x="76" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">FRANCE</text>`;
  if(routePoints.length>1){
    const path = routePoints.map((p,i)=>`${i===0?"M":"L"} ${p.x} ${p.y}`).join(" ");
    svg += `<path d="${path}" fill="none" stroke="url(#routeStroke)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  extra.forEach(name=>{
    const n = mapNodes[name];
    if(!n) return;
    svg += `<circle cx="${n.x}" cy="${n.y}" r="6" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="${n.x}" y="${n.y-11}" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">${name}</text>`;
  });
  labels.forEach((name, idx) => {
    const n = mapNodes[name];
    if(!n) return;
    const airport = idx===0 || idx===labels.length-1;
    const fill = airport ? "#111827" : "#ffffff";
    const text = airport ? "#ffffff" : "#111827";
    svg += `<circle cx="${n.x}" cy="${n.y}" r="11" fill="${fill}" stroke="#111827" stroke-width="2.2"/>`;
    svg += `<circle cx="${n.x}" cy="${n.y}" r="4" fill="${airport ? "#ffffff" : "#111827"}"/>`;
    svg += `<rect x="${n.x-15}" y="${n.y-34}" width="30" height="20" rx="11" ry="11" fill="${fill}" stroke="#111827" stroke-width="1.3"/>`;
    svg += `<text x="${n.x}" y="${n.y-20}" text-anchor="middle" font-size="11" font-weight="700" fill="${text}">${idx+1}</text>`;
    svg += `<text x="${n.x}" y="${n.y+30}" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">${name}</text>`;
  });
  svg += `</svg>`;
  return `<div class="map-wrap">${svg}</div><div class="caption">출국 도시에 가까운 도시를 마지막에 두는 방식으로 동선을 조정했습니다.</div>`;
}

function renderLinkGroups(groups){
  let html = '<div class="blog-links">';
  groups.forEach(([group, items])=>{
    html += `<div class="link-group"><strong>${group}</strong><div class="linkchips">`;
    items.forEach(item=> html += `<a class="link-chip" href="${item.url}" target="_blank" rel="noopener noreferrer">${item.title}</a>`);
    html += `</div></div>`;
  });
  html += '</div>';
  return html;
}

// ---------- Recommend mode ----------

function applyStylePriority(style, routeCities, days, outCity){
  const primaryMap = {
    "풍경": "레만호",
    "하이킹": "체르마트",
    "도시": outCity === "취리히" ? "루체른" : "제네바",
    "균형": "인터라켄"
  };
  const primary = primaryMap[style];
  let route = [...routeCities];

  if (primary && !route.includes(primary)) {
    if (outCity === "취리히" && primary === "루체른") route.push(primary);
    else if (outCity === "제네바" && (primary === "제네바" || primary === "레만호")) route.push(primary);
    else route.unshift(primary);
  }

  route = route.filter((v, i, a) => a.indexOf(v) === i);
  const roughCap = days <= 5 ? 2 : days <= 7 ? 4 : 5;
  if (route.length > roughCap) route = route.slice(0, roughCap);
  return route;
}

function getRecommendedStops(days, inCity, outCity, style){
  let routeCities = [];
  if(outCity==="취리히"){
    if(days===5) routeCities = ["체르마트","인터라켄"];
    else if(days===6) routeCities = ["체르마트","인터라켄","루체른"];
    else if(days===7) routeCities = ["제네바","체르마트","인터라켄","루체른"];
    else if(days===8) routeCities = ["레만호","체르마트","인터라켄","루체른"];
    else if(days===9 || days===10) routeCities = ["레만호","체르마트","인터라켄","루체른"];
  } else {
    if(days===5) routeCities = ["인터라켄","체르마트"];
    else if(days===6) routeCities = ["인터라켄","체르마트","제네바"];
    else if(days===7) routeCities = ["루체른","인터라켄","체르마트","제네바"];
    else if(days===8) routeCities = ["루체른","인터라켄","체르마트","레만호","제네바"];
    else if(days===9 || days===10) routeCities = ["루체른","인터라켄","체르마트","레만호","제네바"];
  }
  routeCities = applyStylePriority(style, routeCities, days, outCity);
  return routeCities;
}
function buildRecDays(days, outCity, style, routeCities){
  const p = [];
  const has = (name) => routeCities.includes(name);

  const regionPlans = {
    "루체른": [],
    "인터라켄": [],
    "체르마트": [],
    "레만호": [],
    "제네바": []
  };

  // Build candidate activities by region
  if(style === "풍경"){
    regionPlans["레만호"].push("레만호 / 라보 와이너리와 몽트뢰, 브베 중심 풍경 일정");
    regionPlans["인터라켄"].push("시그리스빌 · 이젤발트 · 룽게른 같은 소도시 풍경");
    regionPlans["인터라켄"].push("그린델발트 / 피르스트 또는 하더쿨룸");
    regionPlans["루체른"].push("루체른 호수 유람선과 시내 산책");
    regionPlans["체르마트"].push("고르너그라트 전망대와 마터호른 조망");
  } else if(style === "하이킹"){
    regionPlans["체르마트"].push("체르마트 이동 또는 마을 산책");
    regionPlans["체르마트"].push("고르너그라트");
    regionPlans["체르마트"].push("5대호수 트레킹");
    regionPlans["인터라켄"].push("그린델발트 / 피르스트");
    regionPlans["인터라켄"].push("멘리헨 또는 뮤렌 하이킹");
    regionPlans["루체른"].push("리기산 하이킹");
    regionPlans["레만호"].push("라보 와이너리 하이킹");
  } else if(style === "도시"){
    regionPlans["루체른"].push("루체른 구시가지와 카펠교");
    regionPlans["인터라켄"].push("베른 또는 인터라켄 근교 도시 산책");
    regionPlans["레만호"].push("로잔 또는 몽트뢰 도시 일정");
    regionPlans["제네바"].push("제네바 시내와 호수 주변");
    regionPlans["체르마트"].push("체르마트 마을 위주로 짧게");
  } else {
    regionPlans["루체른"].push("루체른 시내 + 호수 유람선");
    regionPlans["인터라켄"].push("융프라우요흐");
    regionPlans["인터라켄"].push("그린델발트 / 피르스트");
    regionPlans["인터라켄"].push("인터라켄 소도시 하루");
    regionPlans["체르마트"].push("체르마트 이동");
    regionPlans["체르마트"].push("고르너그라트");
    regionPlans["체르마트"].push("5대호수 트레킹");
    regionPlans["레만호"].push("라보 와이너리");
    regionPlans["제네바"].push("제네바 시내");
  }

  // Allocate days in route order instead of fixed order by style
  const regionDayTargets = {};
  const baseTargets = {
    "루체른": 1,
    "인터라켄": style === "균형" ? 2 : 1,
    "체르마트": style === "하이킹" ? 2 : 1,
    "레만호": style === "풍경" ? 2 : 1,
    "제네바": 1
  };

  let totalAssigned = 0;
  routeCities.forEach(region => {
    const n = Math.max(1, Math.min((regionPlans[region] || []).length || 1, baseTargets[region] || 1));
    regionDayTargets[region] = n;
    totalAssigned += n;
  });

  // Add extra days prioritizing route order and style anchors, without breaking route order
  const extraPriority = [...routeCities];
  while(totalAssigned < days){
    let added = false;
    for (const region of extraPriority){
      const maxForRegion = Math.max((regionPlans[region] || []).length, 2);
      if((regionDayTargets[region] || 0) < maxForRegion && totalAssigned < days){
        regionDayTargets[region] += 1;
        totalAssigned += 1;
        added = true;
      }
    }
    if(!added) break;
  }

  // Emit days in route order
  routeCities.forEach(region => {
    if(!has(region)) return;
    const pool = regionPlans[region].length ? regionPlans[region] : [`${region} 일정`];
    const count = regionDayTargets[region] || 0;
    for(let i=0;i<count;i++){
      p.push(pool[i % pool.length]);
    }
  });

  // Final city/day handling
  if(outCity === "취리히"){
    if(p.length < days) p.push("루체른 또는 취리히 근교에서 마무리");
  } else {
    if(p.length < days) p.push("제네바 시내 또는 레만호권에서 마무리");
  }

  const fallback = [
    "인터라켄 소도시 추가",
    "라보 와이너리 하이킹 추가",
    "리기산 하이킹 추가",
    "베른 또는 로잔 반나절 추가"
  ];
  let idx = 0;
  while(p.length < days){
    p.push(fallback[idx % fallback.length]);
    idx += 1;
  }
  return p.slice(0, days);
}

  document.getElementById("recommendResult").innerHTML = html;
}

function selectedRegionsOrdered(start, end){
  const names = [];
  if(state.regions.lucerne) names.push("루체른");
  if(state.regions.interlaken) names.push("인터라켄");
  if(state.regions.zermatt) names.push("체르마트");
  if(state.regions.lakegeneva) names.push("레만호");

  // Outbound city has priority for the final region.
  // 취리히 OUT: finish near 루체른/취리히 side, so start from the far side.
  // 제네바 OUT: finish near 레만호/제네바 side.
  if(end==="취리히"){
    return ["레만호","체르마트","인터라켄","루체른"].filter(v=>names.includes(v));
  }
  return ["루체른","인터라켄","체르마트","레만호"].filter(v=>names.includes(v));
}
function regionNeededDays(){
  const out={};
  if(state.regions.lucerne){
    let s=0; if(state.lucerne.city) s+=0.5; if(state.lucerne.cruise) s+=0.5; if(state.lucerne.rigi) s+=0.75;
    out["루체른"]=Math.max(1, Math.ceil(s));
  }
  if(state.regions.interlaken){
    let s=0; if(state.interlaken.jungfrau) s+=1; if(state.interlaken.wengen) s+=0.5; if(state.interlaken.kleine) s+=0.5;
    if(state.interlaken.maennlichen) s+=0.5; if(state.interlaken.first) s+=1; if(state.interlaken.harder) s+=0.5;
    if(state.interlaken.muerren) s+=0.75; if(state.interlaken.alpin) s+=0.5; if(state.interlaken.towns) s+=1;
    out["인터라켄"]=Math.max(1, Math.ceil(s));
  }
  if(state.regions.zermatt){
    let s=0; if(state.zermatt.gorner) s+=0.5; if(state.zermatt.five) s+=1;
    out["체르마트"]=Math.max(1, Math.ceil(s));
  }
  if(state.regions.lakegeneva){
    let s=0; if(state.lakegeneva.lavaux) s+=0.5; if(state.lakegeneva.classic) s+=1; if(state.lakegeneva.famous) s+=1;
    out["레만호"]=Math.max(1, Math.ceil(s));
  }
  return out;
}
function getRemovalPriority(){ return ["루체른","레만호","체르마트","인터라켄"]; }
function minimumDaysForOrdered(ordered){
  const need = regionNeededDays();
  return ordered.reduce((s,name)=> s+(need[name]||1), 0);
}
function autoTrimRegions(totalDays, ordered){
  let current=[...ordered], removed=[], minDays=minimumDaysForOrdered(current), priority=getRemovalPriority();
  while(current.length>1 && minDays>totalDays){
    const cand = priority.find(name=>current.includes(name));
    if(!cand) break;
    current=current.filter(v=>v!==cand);
    removed.push(cand);
    minDays=minimumDaysForOrdered(current);
  }
  return {ordered:current, removed, minDays};
}
function fitDays(ordered, totalDays){
  const need = regionNeededDays();
  let plan = ordered.map(name=>({name, days: need[name]||1}));
  let sum = plan.reduce((a,b)=>a+b.days,0);
  if(sum<=totalDays){
    let remain = totalDays-sum;
    const priority = ["인터라켄","체르마트","레만호","루체른"];
    while(remain>0){
      for(const p of priority){
        const t=plan.find(v=>v.name===p);
        if(t && remain>0){ t.days += 1; remain -= 1; }
      }
    }
    return plan;
  }
  while(sum>totalDays){
    const reduceOrder=["루체른","레만호","체르마트","인터라켄"];
    let changed=false;
    for(const p of reduceOrder){
      const t=plan.find(v=>v.name===p);
      if(t && t.days>1 && sum>totalDays){ t.days -= 1; sum -= 1; changed=true; }
    }
    if(!changed) break;
  }
  return plan;
}

  if(state.lakegeneva.classic && state.lakegeneva.classicBern) pts.push("베른");
  if(state.lakegeneva.classic && state.lakegeneva.classicGeneva) pts.push("제네바");
  if(state.lakegeneva.classic && state.lakegeneva.classicLausanne) pts.push("로잔");
  if(state.lakegeneva.famous && state.lakegeneva.famousTolo) pts.push("Tolochenaz");
  if(state.lakegeneva.famous && state.lakegeneva.famousVevey) pts.push("Vevey");
  if(state.lakegeneva.famous && state.lakegeneva.famousMontreux) pts.push("Montreux");
  return [...new Set(pts)];
}
function regionDescription(name){
  if(name==="루체른"){
    let picks=[]; if(state.lucerne.city) picks.push("시내 관광"); if(state.lucerne.cruise) picks.push("호수 유람선"); if(state.lucerne.rigi) picks.push("리기산");
    return `루체른에서는 ${picks.join(", ")}을(를) 묶는 구성이 기본입니다.`;
  }
  if(name==="인터라켄"){
    let picks=[]; if(state.interlaken.jungfrau) picks.push("융프라우요흐"); if(state.interlaken.first) picks.push("그린델발트 피르스트");
    if(state.interlaken.maennlichen) picks.push("멘리헨"); if(state.interlaken.muerren) picks.push("뮤렌");
    if(state.interlaken.towns && state.interlaken.drama) picks.push("드라마 촬영지 코스"); if(state.interlaken.towns && state.interlaken.classic) picks.push("전통 소도시");
    return `인터라켄에서는 ${picks.join(", ")} 중심으로 일정이 구성됩니다.`;
  }
  if(name==="체르마트"){
    let picks=[]; if(state.zermatt.gorner) picks.push("고르너그라트"); if(state.zermatt.five) picks.push("5대호수 트레킹");
    return `체르마트는 ${picks.join(", ")} 중심으로 보는 것이 가장 무난합니다.`;
  }
  if(name==="레만호"){
    let picks=[]; if(state.lakegeneva.lavaux) picks.push("라보 와이너리"); if(state.lakegeneva.classic) picks.push("전통 관광 도시"); if(state.lakegeneva.famous) picks.push("유명 인물 테마");
    return `레만호는 ${picks.join(", ")} 중심으로 일정이 구성됩니다.`;
  }
  return "";
}
function buildManualDayByDay(start, end, totalDays, ordered, plan){
  const days=[]; let d=1;
  for(const p of plan){
    for(let i=0;i<p.days && d<=totalDays;i++){
      let desc="";
      if(p.name==="루체른"){
        const pool=[]; if(state.lucerne.city) pool.push("루체른 구시가지와 카펠교를 천천히 둘러보는 날입니다."); if(state.lucerne.cruise) pool.push("루체른 호수 유람선을 중심으로 풍경을 즐기기 좋은 날입니다."); if(state.lucerne.rigi) pool.push("리기산 하이킹이나 산악열차를 중심으로 일정을 짜기 좋습니다."); if(!pool.length) pool.push("루체른의 호수와 시내를 여유롭게 보는 일정입니다."); desc=pool[i % pool.length];
      } else if(p.name==="인터라켄"){
        const pool=[]; if(state.interlaken.jungfrau) pool.push("융프라우요흐, 클라이네 샤이덱, 벵엔을 묶기 좋은 핵심 일정입니다."); if(state.interlaken.first) pool.push("그린델발트 피르스트와 라우터브루넨, 혹은 하더쿨룸을 묶기 좋은 날입니다."); if(state.interlaken.maennlichen) pool.push("멘리헨과 벵엔 방향의 하이킹을 넣기 좋은 날입니다."); if(state.interlaken.muerren) pool.push("뮤렌과 주변 산악 마을을 묶어 걷기 좋은 날입니다."); if(state.interlaken.alpin) pool.push("알파인 가든과 근교 산책 코스를 넣기 좋은 날입니다."); if(state.interlaken.towns && state.interlaken.drama) pool.push("시그리스빌, 이젤발트, 룽게른 같은 드라마 촬영지를 묶어 보기 좋은 날입니다."); if(state.interlaken.towns && state.interlaken.classic) pool.push("베른, 힐터핑겐, 스피치 같은 클래식 소도시 중 1~2곳을 넣기 좋은 날입니다."); if(!pool.length) pool.push("인터라켄과 근교 전망대를 중심으로 여유 있게 구성하는 날입니다."); desc=pool[i % pool.length];
      } else if(p.name==="체르마트"){
        const pool=[]; if(state.zermatt.gorner) pool.push("고르너그라트 전망대와 오후 하이킹을 넣기 좋은 날입니다."); if(state.zermatt.five) pool.push("5대호수 트레킹이나 수네가 방향 하이킹을 넣기 좋은 날입니다."); if(!pool.length) pool.push("체르마트 마을과 마터호른 조망 위주로 여유 있게 보내기 좋은 날입니다."); desc=pool[i % pool.length];
      } else if(p.name==="레만호"){
        const pool=[]; if(state.lakegeneva.famous) pool.push("Tolochenaz, Vevey, Montreux를 중심으로 유명 인물 테마 루트를 즐기기 좋은 날입니다."); if(state.lakegeneva.classic) pool.push("베른, 제네바, 로잔 중 동선에 맞는 도시를 넣어 전통적인 도시 여행을 하기 좋은 날입니다."); if(state.lakegeneva.lavaux) pool.push("라보 와이너리와 몽트뢰, 브베를 중심으로 호수 풍경을 즐기기 좋은 날입니다."); if(!pool.length) pool.push("레만호 주변 소도시를 가볍게 묶어보는 날입니다."); desc=pool[i % pool.length];
      }
      days.push({d, title:p.name, desc}); d++;
    }
  }
  while(days.length<totalDays) days.push({d:days.length+1, title:"여유 일정", desc:"날씨에 따라 전망대나 소도시 일정 중 하나를 조정하는 예비일로 생각하면 좋습니다."});
  return days.slice(0,totalDays);
}
function buildManual(){
  const start = document.getElementById("manInCity").value;
  const end = document.getElementById("manOutCity").value;
  const totalDays = parseInt(document.getElementById("manDays").value,10);
  const initialOrdered = selectedRegionsOrdered(start, end);
  const trim = autoTrimRegions(totalDays, initialOrdered);
  const ordered = trim.ordered;
  const plan = fitDays(ordered, totalDays);
  const labels = [start, ...ordered, end];
  const extra = getExtraManualPoints();
  let html = `<div class="summary"><strong>한 줄 요약</strong><br>${start} IN / ${end} OUT 기준 ${totalDays}일 일정입니다. 출국 도시를 기준으로 마지막이 공항과 가까운 지역이 되도록 조정하면 ${ordered.join(" → ")} 순서가 가장 무난합니다.</div>`;
  const initialMinDays = minimumDaysForOrdered(initialOrdered);
  if(trim.removed.length>0){
    html += `<div class="notice"><strong>일정 현실성 체크</strong><br>현재 선택한 지역과 명소는 최소 <strong>${initialMinDays}일</strong> 정도가 필요합니다. ${totalDays}일 일정에 맞추기 위해 <strong>${trim.removed.join(", ")}</strong> 지역이 자동으로 제외되었습니다.</div>`;
  }
  html += routeLine(labels);
  html += buildMapSection(labels, extra);
  html += `<div class="two-col"><div class="card"><h3>지역별 배정</h3><div class="list">`;
  plan.forEach(p=> html += `<div class="item"><div class="topline"><strong>${p.name}</strong><span class="badge">${p.days}일</span></div><div class="muted" style="margin-top:6px;">${regionDescription(p.name)}</div></div>`);
  html += `</div></div><div class="card"><h3>예상 이동 시간</h3><div class="list">`;
  for(let i=0;i<labels.length-1;i++){
    const time = travelTimes[`${labels[i]}|${labels[i+1]}`] || "약 2시간";
    html += `<div class="item"><div class="topline"><strong>${labels[i]} → ${labels[i+1]}</strong><span class="badge">${time}</span></div></div>`;
  }
  html += `</div></div></div>`;
  const dayByDay = buildManualDayByDay(start, end, totalDays, ordered, plan);
  html += `<div class="card"><h3>추천 일자별 루트</h3><div class="day-list">`;
  dayByDay.forEach(v=> html += `<div class="day"><strong>DAY ${v.d} · ${v.title}</strong><div class="muted">${v.desc}</div></div>`);
  html += `</div></div>`;
  const groups=[]; if(ordered.includes("루체른")) groups.push(["루체른", linkGroups["루체른"]]); if(ordered.includes("인터라켄")) groups.push(["인터라켄 / 소도시", linkGroups["인터라켄 / 소도시"]]); if(ordered.includes("체르마트")) groups.push(["체르마트", linkGroups["체르마트"]]); if(ordered.includes("레만호")) groups.push(["레만호", linkGroups["레만호"]]);
  html += `<div class="card"><h3>이 루트에서 실제 여행기 보기</h3>${renderLinkGroups(groups)}</div>`;
  document.getElementById("manualResult").innerHTML = html;
}

// init
function rerenderRecStyle(){ renderStyleGrid("recStyleGrid", recStyle, k=>{ recStyle=k; rerenderRecStyle(); }); }
function rerenderManStyle(){ renderStyleGrid("manStyleGrid", manStyle, k=>{ manStyle=k; rerenderManStyle(); }); }
rerenderRecStyle();
rerenderManStyle();
renderManualPanels();
setMode('recommend');
buildRecommend();
buildManual();
</script>
