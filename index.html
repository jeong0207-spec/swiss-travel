<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>알프스 여행 루트 추천기</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#0f1f33;--mut:#64748b;--line:#e2e8f0;--acc:#1f6feb;--acc2:#0ea5a4}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.hero{background:linear-gradient(135deg,#0f2a4a,#1f6feb 60%,#0ea5a4);color:#fff;padding:36px 20px 70px}

.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;padding:14px;border:0;border-radius:14px;background:#fff;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 14px #0001}
.tab.on{background:var(--ink);color:#fff}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 6px 24px #0f1f3312;margin-bottom:16px}
.grid{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
label.l{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:12px 0 6px}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:#fff;cursor:pointer;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.go{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;font-size:16px;font-weight:800;cursor:pointer}
#map{height:380px;border-radius:14px}
.route{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 14px}.pill{background:#eef4ff;padding:5px 10px;border-radius:99px;font-weight:700;font-size:14px}
.day{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.dn{flex:0 0 52px;height:52px;border-radius:12px;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.day h4{margin:0 0 2px;font-size:15px}.day p{margin:0;font-size:14px;color:#334155}.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#f1f5f9;margin-left:6px;color:var(--mut)}
.hub{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.hub h4{margin:0}.dim{opacity:.25}.mut{color:var(--mut);font-size:13px}
.hk{font-size:13px;margin:4px 0 0;padding-left:18px}.warn{background:#fff7ed;border-left:4px solid #f97316;padding:10px;border-radius:8px;margin-bottom:10px}
.pick{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;display:flex;gap:8px;align-items:flex-start;font-size:14px}.pick.sat{margin-left:22px;background:#f8fafc}
.pick select{width:auto;padding:4px;font-size:12px}.cty{font-weight:800;margin-top:14px}
.note{font-size:12px;color:var(--mut);margin-top:10px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.hero h1{font-size:24px}#map{height:300px}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details.adv{margin-top:14px;border:1px dashed var(--line);border-radius:12px;padding:8px 12px}details.adv summary{cursor:pointer;font-weight:700;color:var(--mut);font-size:14px}
details.dd{border-top:1px solid var(--line);padding:10px 0}details.dd summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center}details.dd summary::-webkit-details-marker{display:none}

.badge{display:inline-block;font-size:11px;background:#fde68a;color:#7c2d12;border-radius:99px;padding:1px 8px;margin-left:4px;font-weight:700}
.tip{font-size:13px;margin:4px 0}.tip a{color:var(--acc)}
.basegrp{border:1px solid var(--line);border-radius:12px;margin:6px 0}.basegrp>.pick{border:0;margin:0}.basegrp details{padding:0 10px 8px}.basegrp summary{font-size:12px;color:var(--acc);cursor:pointer}
.go.alt{background:#fff;color:var(--ink);border:2px solid var(--acc2);font-size:14px;margin-top:8px}.badge.hike{background:#dcfce7;color:#166534}
.cityrow{display:grid;grid-template-columns:120px 1fr;gap:6px}.q,.custom input{padding:9px;border:1px solid var(--line);border-radius:10px;font-size:14px;width:100%}
.custom{display:flex;gap:6px;margin-top:6px}.custom button{border:0;border-radius:10px;padding:0 12px;background:#e2e8f0;cursor:pointer;font-weight:700}
.same{font-weight:400;font-size:12px;margin-left:8px;color:var(--ink)}.geo{font-size:12px;margin-top:4px}
.sugbtn{border:1px solid #f97316;background:#fff;border-radius:99px;padding:3px 10px;margin:4px 2px 0;cursor:pointer;font-size:12px}
.hi{background:#fef9c3;border-radius:8px;padding:6px 8px;margin:4px 0}
.shoptoggle{display:flex;gap:8px;align-items:center;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-weight:700;font-size:14px;cursor:pointer}.tipsbox{background:#f0f9ff;border-radius:8px;padding:6px 8px;margin:4px 0;font-size:13px}
.chip.dis{opacity:.4;text-decoration:line-through}
</style></head><body>
<div class="hero"><h1>🏔️ 알프스 여행 루트 추천기</h1><p>스위스 · 프랑스 · 이탈리아 · 오스트리아 · 독일 바이에른 — 국경을 넘어 알프스 전체로 루트를 짜보세요.</p></div>
<div class="wrap">
<div class="tabs"><button class="tab on" data-m="rec">✨ 추천 일정으로 시작</button><button class="tab" data-m="man">🧭 내가 직접 선택</button></div>
<div class="grid">
<div class="card" id="form">
 <label class="l">여행 기간</label><select id="days"></select>
 <label class="l">여행 시작 도시</label>
 <div class="cityrow"><input id="q_entry" class="q" placeholder="🔍 도시 검색"><select id="entry"></select></div>
 <div class="custom"><input id="c_entry" placeholder="목록에 없으면 직접 입력 (예: Strasbourg)"><button type=button data-for="entry">찾기</button></div>
 <label class="l">여행 끝 도시 <label class="same"><input type=checkbox id="same" checked> 시작 도시로 돌아오기</label></label>
 <div id="endBox" style="display:none"><div class="cityrow"><input id="q_exit" class="q" placeholder="🔍 도시 검색"><select id="exit"></select></div>
 <div class="custom"><input id="c_exit" placeholder="목록에 없으면 직접 입력"><button type=button data-for="exit">찾기</button></div></div>
 <div id="recOnly">
 <label class="l">도시 vs 자연</label><div class="chips" id="mix"></div>
 <label class="l">여행 시기 (월)</label><select id="month"></select>
 <label class="l">여행 스타일</label><div class="chips" id="style"></div><div id="trekNote" class="mut" style="display:none">❄️ 이 시기엔 고지대 트레일이 눈에 덮여 트레킹 스타일을 쓸 수 없어요 (보통 6월 중순~10월 초·중순 가능).</div>
 <label class="shoptoggle"><input type=checkbox id="shop"> 🛍️ 쇼핑하며 쉬는 하루 넣기</label>
 <details class="adv"><summary>⚙️ 더 자세히 (나라·예산·이동수단)</summary>
 <label class="l">포함할 나라</label><div class="chips" id="countries"></div>
 <label class="l">예산</label><div class="chips" id="budget"></div>
 <label class="l">여행 속도</label><div class="chips" id="pace"></div>
 <label class="l">이동 수단</label><div class="chips" id="mode"></div>
 <label class="l">돌로미티 진입 루트 (이탈리아 소도시 경유)</label><select id="approach"><option value="">자동</option></select>
 </details>
 </div>
 <div id="manOnly" style="display:none"><label class="l">가고 싶은 거점 선택 <span class="mut">(▸ 를 누르면 근교 당일치기·1박2일)</span></label><div id="picks"></div></div>
 <button class="go" id="go">루트 만들기</button>
 <button class="go alt" id="preset">🚗 취리히 왕복 오스트리아·독일 편안한 루프</button>
 <div class="note">이동 시간은 거리 기반 추정치예요. 실제 시간표·요금은 SBB·Trenitalia·ÖBB 등에서 확인하세요. ₩~₩₩₩₩는 상대적 물가 수준입니다.</div>
</div>
<div><div class="card"><div id="map"></div></div><div class="card" id="out"><p class="mut">왼쪽에서 조건을 고르고 <b>루트 만들기</b>를 눌러보세요.</p></div></div>
</div></div>

 if(o.countries.includes("IT")&&(dw||de)&&!(dw&&de)&&o.days>=8){const one=dw||de;if(one.n>=3){const other=byId[dw?"cortina":"ortisei"];one.n--;hubs.push({x:other,n:1});}}

 h+=`<h3 style="margin-top:20px">거점 자세히 보기</h3>`+r.ord.map(({x})=>`<details class=dd><summary><div><b>${x.n}</b>${badge(x)} <span class=mut>${x.r} · 물가 ${won(x)}</span></div></summary><div class=body>${x.d}<div class=mut>추천 시기: ${x.s.map(s=>SE[s]).join(", ")}</div>${x.hk.length?`<ul class=hk>${x.hk.map(k=>`<li><b>${k[0]}</b>${hikeBadge(k[0])} · ${k[1]}${k[2]?" — "+k[2]:""}</li>`).join("")}</ul>`:""}${(()=>{const subs=D.filter(s=>s.parent===x.id);return subs.length?`<div class=mut>근교: ${subs.map(s=>s.n+(s.mode==="both"?" (당일/1박2일)":" (당일)")).join(", ")}</div>`:""})()}${ACC[x.id]?`<div class=mut>♿ 이동 편의: ${ACC[x.id]}</div>`:""}${CARDS[x.id]?`<div class=mut>🎫 ${CARDS[x.id]}</div>`:""}${tips(x)}</div></details>`).join("");
 h+=`<p class=mut style="margin-top:14px">📒 더 읽을거리: ${BLOG_GENERAL.map(([t,id])=>`<a href="${BLOG_BASE+id}" target=_blank rel=noopener>${t}</a>`).join(" · ")}</p>`;
 $("#out").innerHTML=h;document.querySelectorAll(".sugbtn").forEach(b=>b.onclick=()=>{$("#same").checked=false;$("#endBox").style.display="";$("#exit").value=b.dataset.k;run();});}
S.season=seasonOf(S.month);init();

</script></body></html>
